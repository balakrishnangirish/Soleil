
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Soleil | AI Beauty Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FFD700",
                        "soleil-gold": "#FFD700",
                        "soleil-gold-warm": "#DAA520",
                        "soleil-gold-light": "#FFF4BD",
                        "background-light": "#ffffff",
                        "background-dark": "#fdfaf7", 
                        "surface-dark": "#ffffff",
                        "card-dark": "#ffffff",
                        "text-primary": "#1a1614",
                        "text-secondary": "#8c8479",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "Noto Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "2xl": "2.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'sun-glow': '0 0 15px rgba(255, 215, 0, 0.4)',
                        'sun-glow-lg': '0 0 30px rgba(255, 215, 0, 0.6)',
                    }
                },
            },
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #fdfaf7; margin: 0; min-height: 100vh; font-family: 'Spline Sans', sans-serif; color: #1a1614; }
        #root { height: 100%; }
        .font-filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        
        @keyframes shimmer {
          0% { background-position: -200% 0; }
          100% { background-position: 200% 0; }
        }
        .animate-shimmer {
          background: linear-gradient(90deg, #FFD700 25%, #FFF4BD 50%, #FFD700 75%);
          background-size: 200% auto;
          animation: shimmer 3s infinite linear;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        /* Specifically target inputs and their placeholders for the shimmer effect */
        input.animate-shimmer {
            background-clip: text !important;
            -webkit-background-clip: text !important;
            color: transparent !important;
        }
        
        input.animate-shimmer::placeholder {
            background: linear-gradient(90deg, #FFD700 25%, #FFF4BD 50%, #FFD700 75%);
            background-size: 200% auto;
            animation: shimmer 3s infinite linear;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.8;
        }

        .sun-button-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #FFB900 100%);
        }

        @keyframes supernova-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .supernova-aura-container {
            position: relative;
            z-index: 110;
        }

        .supernova-aura-effect {
            position: absolute;
            inset: -4px;
            background: conic-gradient(from 0deg, #FFD700, #FFF4BD, #DAA520, #FFF4BD, #FFD700);
            border-radius: inherit;
            animation: supernova-spin 4s linear infinite;
            filter: blur(8px);
            z-index: -1;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-background-dark text-text-primary">
    <div id="root"></div>
</body>
</html>
